name: Selenium NUnit Tests

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: selenium-nunit-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  selenium-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true

    steps:
      # Checkout repository code
      - name: Checkout
        uses: actions/checkout@v4

      # Setup .NET SDK with NuGet package cache
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # Ensure Chrome and virtual display are available for Selenium UI tests
      - name: Install browser dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          if ! command -v google-chrome >/dev/null 2>&1; then
            wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
            sudo apt-get install -y ./google-chrome-stable_current_amd64.deb
          fi

      # Restore NuGet packages
      - name: Restore dependencies
        run: dotnet restore ./PlaywrightSiteTAF.sln

      # Build test solution
      - name: Build
        run: dotnet build ./PlaywrightSiteTAF.sln --configuration Release --no-restore

      # Run NUnit Selenium tests
      - name: Run tests
        run: |
          mkdir -p ./TestResults
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
            dotnet test ./PlaywrightSiteTAF.sln \
            --configuration Release \
            --no-build \
            --logger "trx;LogFileName=test-results.trx" \
            --results-directory ./TestResults

      # Create lightweight test summary in the job UI
      - name: Test summary
        if: always()
        run: |
          echo "## NUnit + Selenium run" >> $GITHUB_STEP_SUMMARY
          find ./TestResults -type f -name "*.trx" -print | sed 's/^/- /' >> $GITHUB_STEP_SUMMARY || true

      # Always upload NUnit test result files
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nunit-test-results
          path: |
            TestResults/**/*.trx
            **/TestResults/*.trx
            **/TestResults/**/*.xml
          if-no-files-found: warn

      # Always upload Selenium diagnostics (if produced)
      - name: Upload Selenium artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-artifacts
          path: |
            **/test-results/**
            **/screenshots/**
          if-no-files-found: warn